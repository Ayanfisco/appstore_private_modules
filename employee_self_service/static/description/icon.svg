<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d47a1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern overlay -->
  <rect width="128" height="128" rx="22" ry="22" fill="none" stroke="white" stroke-width="0.3" opacity="0.1"/>

  <!-- Person silhouette - head -->
  <circle cx="64" cy="38" r="16" fill="url(#personGrad)" filter="url(#shadow)"/>

  <!-- Person silhouette - body -->
  <path d="M36 88 C36 68 92 68 92 88 L92 96 L36 96 Z" fill="url(#personGrad)" filter="url(#shadow)"/>

  <!-- Checkmark / self-service badge -->
  <circle cx="90" cy="90" r="16" fill="#43a047"/>
  <polyline points="83,90 88,95 97,84" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
